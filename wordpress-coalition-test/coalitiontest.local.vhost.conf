<VirtualHost *:80>
    ServerName coalitiontest.local
    DocumentRoot /var/www/coalitiontest.local
    <Directory /var/www/coalitiontest.local>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/coalitiontest.local-error.log
    CustomLog ${APACHE_LOG_DIR}/coalitiontest.local-access.log combined
</VirtualHost>
